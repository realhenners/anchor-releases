name: Idea or feature request
description: Something Anchor could do, or do better
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Anchor to do?
      description: The problem you run into helps more than a finished design.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Another tool, a workaround, or not at all.
